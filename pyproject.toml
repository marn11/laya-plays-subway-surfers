[project]
name = "laya-plays-subway-surfers"
version = "0.1.0"
description = "Fine-tune Laya to play a Subway-Surfers-style endless runner"
authors = [
    { name = "marn11", email = "benchmarin5@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "laya>=0.3.22",
    "playwright>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
